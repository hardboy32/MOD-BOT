app:
  name: MOD-BOT
  store_message_content: false

moderation:
  enabled: true
  delete_links: true
  blocked_domains: []
  profanity_filter: true
  profanity_words: []
  blocked_words: []
  repeat_messages: true
  duplicate_window_seconds: 20
  rate_limit:
    messages: 6
    window_seconds: 8
  actions:
    warning_threshold: 1
    timeout_threshold: 2
    ban_threshold: 5
    timeout_seconds: 60
    max_timeout_seconds: 3600

# Connections are loaded from connections.yaml. Each entry is an independent
# channel/account, with isolated moderation counters and optional rule overrides.
platforms:
  twitch:
    enabled: true
  youtube:
    enabled: true
  kick:
    enabled: true
  aparat:
    enabled: true
