# Add as many independent channel connections as needed.
# Store all real credentials in Railway Variables, never in this file.
connections: []
# Examples:
#
# Twitch:
# connections:
#   - id: twitch-one
#     platform: twitch
#     channel: channel_login
#     username_env: TWITCH_BOT_USERNAME
#     token_env: TWITCH_OAUTH_TOKEN
#
# YouTube:
#   - id: youtube-one
#     platform: youtube
#     live_chat_id: YOUR_LIVE_CHAT_ID
#     access_token_env: YOUTUBE_ACCESS_TOKEN
#
# Kick: each broadcaster account needs its own user OAuth token.
# Required scopes: chat:read events:subscribe moderation:chat_message:manage moderation:ban chat:write
# Enable Webhooks in Kick Developer settings and set the webhook URL to
# https://YOUR-RAILWAY-DOMAIN/webhooks/kick
# KICK_WEBHOOK_URL in Railway must use the same address.
#   - id: kick-one
#     platform: kick
#     broadcaster_user_id: 123456789
#     access_token_env: KICK_ONE_ACCESS_TOKEN
#     refresh_token_env: KICK_ONE_REFRESH_TOKEN
#
#   - id: kick-two
#     platform: kick
#     broadcaster_user_id: 987654321
#     access_token_env: KICK_TWO_ACCESS_TOKEN
#     refresh_token_env: KICK_TWO_REFRESH_TOKEN
#
# Aparat: adapter scaffold is prepared but the integration is disabled until
# Aparat provides its official live-chat + moderation API contract and access.
# See APARAT_API_INTEGRATION.md for the exact required docs and sample payloads.
# Do not add an Aparat connection yet; guessed/private endpoints are not used.
